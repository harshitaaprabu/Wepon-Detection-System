{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Alert</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/alert.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/util.css' %}">
</head>

<body style="background-color:#f8f9fa;">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <a class="navbar-brand ml-4" href="{% url 'home' %}">
            Weapon Detection System
        </a>
    </nav>

    <div class="container mt-4">

        <h3 class="text-center mb-4">Detection Alerts</h3>

        <div class="row">

            {% for alert in uploadAlert %}

            <div class="col-md-4 mb-4">
                <div class="card shadow">

                    <!-- Image -->
                    <img src="{% static 'images/' %}{{alert.image}}" 
                         class="card-img-top"
                         style="height:220px; object-fit:cover;">

                    <!-- Details -->
                    <div class="card-body">
                        <p><strong>Location:</strong> {{alert.location}}</p>
                        <p><strong>Alert Sent To:</strong> {{alert.alert_receiver}}</p>
                        <p><strong>Time:</strong> {{alert.date_created|date:"Y-m-d H:i:s"}}</p>
                    </div>

                </div>
            </div>

            {% endfor %}

        </div>
    </div>

</body>
</html>
